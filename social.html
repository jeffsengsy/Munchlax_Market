<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Munchlax Market</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap"
        rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            background: linear-gradient(180deg,
                    #1a3a4a 0%,
                    #2a5a6a 18%,
                    #3d7a7a 38%,
                    #5a9a88 58%,
                    #6aaa70 75%,
                    #4a7840 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            position: relative;
        }

        #stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .pokeball-float {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            from {
                transform: translateY(105vh) rotate(0deg);
            }

            to {
                transform: translateY(-10vh) rotate(360deg);
            }
        }

        .moon {
            position: fixed;
            top: 24px;
            right: 36px;
            z-index: 2;
            opacity: 0.9;
            animation: moonPulse 4s ease-in-out infinite;
        }

        @keyframes moonPulse {

            0%,
            100% {
                filter: drop-shadow(0 0 8px rgba(210, 240, 190, 0.5));
            }

            50% {
                filter: drop-shadow(0 0 20px rgba(210, 240, 190, 0.9));
            }
        }

        .page {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            padding: 50px 22px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo */
        .logo-wrap {
            width: 148px;
            height: 148px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid rgba(255, 255, 255, 0.3);
            box-shadow:
                0 0 0 7px rgba(160, 220, 210, 0.18),
                0 10px 50px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            opacity: 0;
            animation: popIn 0.6s cubic-bezier(.34, 1.56, .64, 1) 0.1s forwards;
        }

        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeUp 0.55s ease 0.35s forwards;
        }

        .header h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.7rem;
            color: #f0ece0;
            letter-spacing: 1px;
            line-height: 1.1;
            text-shadow: 2px 3px 0 rgba(30, 80, 90, 0.7), 0 0 24px rgba(160, 220, 200, 0.35);
        }

        .tagline {
            font-size: 0.9rem;
            font-weight: 800;
            color: #a8d8d0;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .dot {
            color: #d4c9a8;
            margin: 0 5px;
        }

        /* Divider */
        .divider {
            width: 75%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(160, 220, 210, 0.55), rgba(240, 236, 224, 0.35), rgba(160, 220, 210, 0.55), transparent);
            margin: 20px 0 28px;
            opacity: 0;
            animation: fadeUp 0.4s ease 0.52s forwards;
        }

        /* Cards */
        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .link-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            border-radius: 20px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.22s cubic-bezier(.34, 1.56, .64, 1), box-shadow 0.2s ease;
            opacity: 0;
            animation: slideIn 0.5s cubic-bezier(.34, 1.56, .64, 1) forwards;
        }

        .link-card:nth-child(1) {
            animation-delay: 0.66s;
        }

        .link-card:nth-child(2) {
            animation-delay: 0.80s;
        }

        .link-card:nth-child(3) {
            animation-delay: 0.94s;
        }

        .link-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.13) 0%, transparent 55%);
            pointer-events: none;
        }

        .link-card:hover {
            transform: translateY(-5px) scale(1.025);
        }

        .link-card:active {
            transform: scale(0.97);
        }

        .card-ig {
            background: linear-gradient(135deg, #5a3a6a, #a04060, #c87050);
            box-shadow: 0 6px 28px rgba(90, 58, 106, 0.5);
        }

        .card-ig:hover {
            box-shadow: 0 12px 40px rgba(90, 58, 106, 0.7);
        }

        .card-tt {
            background: linear-gradient(135deg, #182e2a, #2a4842, #182e2e);
            box-shadow: 0 6px 28px rgba(18, 40, 36, 0.7);
            border-color: rgba(120, 200, 190, 0.22);
        }

        .card-tt:hover {
            box-shadow: 0 12px 40px rgba(120, 200, 190, 0.32);
        }

        .card-yt {
            background: linear-gradient(135deg, #7a2020, #c03030, #a02828);
            box-shadow: 0 6px 28px rgba(120, 32, 32, 0.55);
        }

        .card-yt:hover {
            box-shadow: 0 12px 40px rgba(192, 48, 48, 0.65);
        }

        .icon-wrap {
            width: 48px;
            height: 48px;
            border-radius: 13px;
            background: rgba(255, 255, 255, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-wrap svg {
            width: 26px;
            height: 26px;
        }

        .card-text {
            flex: 1;
        }

        .card-name {
            font-family: 'Fredoka One', cursive;
            font-size: 1.25rem;
            color: #fff;
            letter-spacing: 1px;
            line-height: 1;
        }

        .card-handle {
            font-size: 0.77rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 3px;
            letter-spacing: 0.3px;
        }

        .arrow {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.15rem;
            transition: transform 0.18s ease, color 0.18s ease;
        }

        .link-card:hover .arrow {
            transform: translateX(5px);
            color: rgba(255, 255, 255, 0.9);
        }

        /* TikTok shimmer */
        .tt-shine {
            position: absolute;
            top: 0;
            left: -120%;
            width: 45%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(120, 200, 190, 0.09), transparent);
            animation: ttShine 3.5s ease-in-out 1.8s infinite;
        }

        @keyframes ttShine {
            0% {
                left: -120%;
            }

            55%,
            100% {
                left: 160%;
            }
        }

        /* Footer */
        .footer {
            margin-top: 46px;
            width: 100%;
            text-align: center;
            opacity: 0;
            animation: fadeUp 0.5s ease 1.15s forwards;
        }

        .footer svg {
            width: 100%;
            max-width: 380px;
            opacity: 0.45;
        }

        .footer-txt {
            font-size: 0.7rem;
            color: rgba(200, 235, 225, 0.4);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-top: 14px;
        }

        /* Keyframes */
        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.55);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-26px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>

        // Stars
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize();
        window.addEventListener('resize', resize);

        const STARS = Array.from({ length: 130 }, () => ({
            x: Math.random(),
            y: Math.random() * 0.68,
            r: Math.random() * 1.5 + 0.3,
            phase: Math.random() * Math.PI * 2,
            speed: Math.random() * 0.7 + 0.25,
            cross: Math.random() < 0.22
        }));

        let t = 0;
        (function frame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            t += 0.011;
            STARS.forEach(s => {
                const a = 0.18 + 0.72 * (0.5 + 0.5 * Math.sin(s.phase + t * s.speed));
                const px = s.x * canvas.width;
                const py = s.y * canvas.height;
                ctx.globalAlpha = a;
                ctx.fillStyle = '#ddf0e0';
                ctx.strokeStyle = '#ddf0e0';
                if (s.cross) {
                    ctx.lineWidth = s.r * 0.9;
                    ctx.beginPath();
                    ctx.moveTo(px, py - s.r * 2.8); ctx.lineTo(px, py + s.r * 2.8);
                    ctx.moveTo(px - s.r * 2.8, py); ctx.lineTo(px + s.r * 2.8, py);
                    ctx.stroke();
                    ctx.beginPath(); ctx.arc(px, py, s.r * 0.6, 0, Math.PI * 2); ctx.fill();
                } else {
                    ctx.beginPath(); ctx.arc(px, py, s.r, 0, Math.PI * 2); ctx.fill();
                }
            });
            ctx.globalAlpha = 1;
            requestAnimationFrame(frame);
        })();

        // Floating Pokéballs
        const ballDefs = [
            ['#cc3030', '#fff'], ['#3060c0', '#fff'], ['#181818', '#fff'], ['#309050', '#fff'], ['#aa5500', '#fff']
        ];
        for (let i = 0; i < 7; i++) {
            const [top] = ballDefs[i % ballDefs.length];
            const sz = 24 + Math.random() * 30;
            const el = document.createElement('div');
            el.className = 'pokeball-float';
            el.style.cssText = `left:${Math.random() * 94}%;width:${sz}px;height:${sz}px;animation-duration:${13 + Math.random() * 18}s;animation-delay:${-Math.random() * 22}s`;
            el.innerHTML = `<svg viewBox="0 0 40 40" width="${sz}" height="${sz}">
    <circle cx="20" cy="20" r="18.5" fill="none" stroke="white" stroke-width="2.5"/>
    <path d="M1.5 20 A18.5 18.5 0 0 1 38.5 20Z" fill="${top}"/>
    <path d="M1.5 20 A18.5 18.5 0 0 0 38.5 20Z" fill="white"/>
    <line x1="1.5" y1="20" x2="38.5" y2="20" stroke="white" stroke-width="2.5"/>
    <circle cx="20" cy="20" r="6" fill="white"/>
    <circle cx="20" cy="20" r="4" fill="${top}"/>
    <circle cx="20" cy="20" r="2" fill="white"/>
  </svg>`;
            document.body.appendChild(el);
        }
    </script>
</body>
